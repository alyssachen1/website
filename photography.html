      name="description"
      content="Photography by Alyssa Chen."

  <body>
    <div class="page-shell">
      <header class="topbar" aria-label="Main navigation">
        <nav>
          <a href="index.html">home</a>
          <a href="https://github.com/alyssachen1" target="_blank" rel="noreferrer">github</a>

        </nav>

      <main class="detail-page gallery-page">
        <p class="detail-kicker">i like photography.</p>

        <!--
          how to add a photo:
          1. drop the .jpeg into the photographs/ folder
          2. copy the block below, paste it inside <div class="photo-grid">,
             and change the file name, alt text, and caption
             (to change a caption, replace the placeholder text between <figcaption> and </figcaption>;
              leave it empty for no caption. captions show on hover.)

          <figure class="photo" tabindex="0">
            <img src="photographs/your-photo.jpeg" alt="short description of the photo" loading="lazy" />
            <figcaption>your caption here</figcaption>
          </figure>
        -->

        <figure class="photo photo-featured" tabindex="0">
          <img src="photographs/bw_ggp.jpeg" alt="black and white view of the golden gate bridge across a marsh" />
          <figcaption>i remember san francisco as fond as when i got my first b&w roll of film developed and recieved this picture. taken at crissy field, my escape from the busy city. </figcaption>
        </figure>

        <div class="photo-grid">
          <figure class="photo" tabindex="0">
            <img src="photographs/campanile.jpeg" alt="the campanile at uc berkeley against a blue sky" loading="lazy" />
            <figcaption>the campanile; a symbol of academic excellence, taken during cal day.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/sf_bw.jpeg" alt="black and white view of the golden gate bridge over the bay, with a footbridge and brush in the foreground" loading="lazy" />
            <figcaption>san francisco; a city of contrasts, captured in black and white.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/biker_flower.jpeg" alt="purple and pink allium flowers in the foreground of a park" loading="lazy" />
            <figcaption>the figure of a biker peeks through a field of dandelions. taken in seattle.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/ggb_birds_color.jpeg" alt="shorebirds on a lagoon with the golden gate bridge in the distance" loading="lazy" />
            <figcaption>birds resting on a lagoon against the golden gate bridge.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/bw_parasail.jpeg" alt="black and white photo of a long footbridge over the water with a parasail in the sky" loading="lazy" />
            <figcaption>crissy field conversationalists.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/skateboard.jpeg" alt="a skateboarder in a plaza in front of an ornate building with palm trees" loading="lazy" />
            <figcaption>candid of a skateboarder in san diego.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/laguna_beach.jpeg" alt="laguna beach at dusk, with people on the sand below a cliff and palm trees" loading="lazy" />
            <figcaption>laguna beach sunset during my 19th birthday.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/sf_bw_swing.jpeg" alt="black and white photo of a rooftop swing overlooking san francisco houses and hills" loading="lazy" />
            <figcaption>a swing overlooking san francisco on an oddly foggy morning.</figcaption>
          </figure>
          <figure class="photo" tabindex="0">
            <img src="photographs/sunset_rollercoaster.jpeg" alt="sunset rollercoaster performing on stage under colored stage lights" loading="lazy" />
            <figcaption>a sunset rollercoaster performance i attended with my best friend.</figcaption>
          </figure>
        </div>
      </main>
    </div>
  </body>
</html>
