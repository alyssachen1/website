    <script>
      (function () {
        var pieces = Array.prototype.slice.call(document.querySelectorAll(".art-piece"));
        if (!("IntersectionObserver" in window)) return;
        document.documentElement.classList.add("art-animate");
        pieces.forEach(function (el, i) {
          el.style.setProperty("--reveal-delay", (i % 3) * 120 + "ms");
        });
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-in");
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
        pieces.forEach(function (el) { io.observe(el); });
      })();
    </script>
